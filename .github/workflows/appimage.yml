name: AppImage

on:
  push:
    branches: [main]
    paths: ["version.json"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: appimage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Versão
        id: v
        run: echo "ver=$(node -p "require('./version.json').version")" >> "$GITHUB_OUTPUT"
      - name: Dependências
        run: npm ci --no-audit --no-fund
      - name: Build
        run: npm run dist:linux
      - name: Esperar a release v${{ steps.v.outputs.ver }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 60); do
            if gh release view "v${{ steps.v.outputs.ver }}" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then exit 0; fi
            sleep 30
          done
          echo "release v${{ steps.v.outputs.ver }} não apareceu em 30 min"; exit 1
      - name: Anexar à release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "v${{ steps.v.outputs.ver }}" release/LudrixHub-${{ steps.v.outputs.ver }}-x86_64.AppImage -R "$GITHUB_REPOSITORY" --clobber
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LudrixHub-${{ steps.v.outputs.ver }}-AppImage
          path: release/LudrixHub-*.AppImage
          if-no-files-found: ignore
          retention-days: 7
