<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LudrixHub</title>
<link rel="icon" href="/ui/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="/ui/app.css">
<link rel="stylesheet" href="/api/theme/dark" id="themeLink">
<link rel="stylesheet" href="/ui/base.css">
</head>
<body data-face="padrao" class="bs">
  <div class="gpind" id="gpInd" title="Controle conectado"><svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="12" rx="4"/><path d="M7 11v4M5 13h4M15 12h.01M18 14h.01"/></svg></div>
<div class="splash" id="splash" aria-hidden="true"><div class="spw"><div class="sl"><img src="/ui/icon.png" alt=""></div><div class="st">LudrixHub</div><div class="sv" id="spv"></div><div class="sb"><i id="spb"></i></div></div><div class="slog" id="slog"></div><div class="spct" id="spct">0%</div></div>
<div class="rz" data-rz="n"></div><div class="rz" data-rz="s"></div><div class="rz" data-rz="w"></div><div class="rz" data-rz="e"></div>
<div class="rz" data-rz="nw"></div><div class="rz" data-rz="ne"></div><div class="rz" data-rz="sw"></div><div class="rz" data-rz="se"></div>
<div id="backdrop" aria-hidden="true"><div class="bl"></div><div class="bl"></div></div>
<div class="fx" id="fx" aria-hidden="true"></div>

<div id="app">
  <div class="tbrow"></div>
  <div class="wctl" id="wctl">
    <button title="Minimizar" onclick="winCmd('minimize')"><svg viewBox="0 0 10 10"><path d="M1 5h8"/></svg></button>
    <button id="wmax" title="Maximizar" onclick="winCmd('maximize')"><svg class="m" viewBox="0 0 10 10"><rect x="1.5" y="1.5" width="7" height="7" rx="1"/></svg><svg class="r" viewBox="0 0 10 10"><path d="M3 3V1.5h5.5V7H7"/><rect x="1.5" y="3" width="5.5" height="5.5" rx="1"/></svg></button>
    <button class="x" title="Fechar" onclick="winCmd('close')"><svg viewBox="0 0 10 10"><path d="M2 2l6 6M8 2l-6 6"/></svg></button>
  </div>
  <nav class="rail glass" id="rail" data-ctx="nav" aria-label="Navegação principal">
    <div class="brandrow"><div class="brand" title="LudrixHub" id="brand"></div><b class="bname">LudrixHub</b></div>
    <div class="rg" data-g="main">
      <button class="rb on" data-view="home" title="Biblioteca — seus jogos"><svg viewBox="0 0 24 24"><path d="M5 5a1 1 0 0 1 1 -1h2a1 1 0 0 1 1 1v14a1 1 0 0 1 -1 1h-2a1 1 0 0 1 -1 -1l0 -14" /><path d="M9 5a1 1 0 0 1 1 -1h2a1 1 0 0 1 1 1v14a1 1 0 0 1 -1 1h-2a1 1 0 0 1 -1 -1l0 -14" /><path d="M5 8h4" /><path d="M9 16h4" /><path d="M13.803 4.56l2.184 -.53c.562 -.135 1.133 .19 1.282 .732l3.695 13.418a1.02 1.02 0 0 1 -.634 1.219l-.133 .041l-2.184 .53c-.562 .135 -1.133 -.19 -1.282 -.732l-3.695 -13.418a1.02 1.02 0 0 1 .634 -1.219l.133 -.041" /><path d="M14 9l4 -1" /><path d="M16 16l3.923 -.98" /></svg><span>Biblioteca</span></button>
      <button class="rb" data-view="store" title="Store — baixar jogos das fontes"><svg viewBox="0 0 24 24"><path d="M3 21l18 0" /><path d="M3 7v1a3 3 0 0 0 6 0v-1m0 1a3 3 0 0 0 6 0v-1m0 1a3 3 0 0 0 6 0v-1h-18l2 -4h14l2 4" /><path d="M5 21l0 -10.15" /><path d="M19 21l0 -10.15" /><path d="M9 21v-4a2 2 0 0 1 2 -2h2a2 2 0 0 1 2 2v4" /></svg><span>Store</span></button>
      <button class="rb" data-view="emulation" title="Emuladores — consoles e ROMs"><svg viewBox="0 0 24 24"><path d="M12 5h3.5a5 5 0 0 1 0 10h-5.5l-4.015 4.227a2.3 2.3 0 0 1 -3.923 -2.035l1.634 -8.173a5 5 0 0 1 4.904 -4.019h3.4" /><path d="M14 15l4.07 4.284a2.3 2.3 0 0 0 3.925 -2.023l-1.6 -8.232" /><path d="M8 9v2" /><path d="M7 10h2" /><path d="M14 10h2" /></svg><span>Emuladores</span></button>
    </div>
    <i class="rsep"></i>
    <div class="rg" data-g="tools">
      <button class="rb" data-view="mods" title="Mods e ferramentas"><svg viewBox="0 0 24 24"><path d="M4 7h3a1 1 0 0 0 1 -1v-1a2 2 0 0 1 4 0v1a1 1 0 0 0 1 1h3a1 1 0 0 1 1 1v3a1 1 0 0 0 1 1h1a2 2 0 0 1 0 4h-1a1 1 0 0 0 -1 1v3a1 1 0 0 1 -1 1h-3a1 1 0 0 1 -1 -1v-1a2 2 0 0 0 -4 0v1a1 1 0 0 1 -1 1h-3a1 1 0 0 1 -1 -1v-3a1 1 0 0 1 1 -1h1a2 2 0 0 0 0 -4h-1a1 1 0 0 1 -1 -1v-3a1 1 0 0 1 1 -1" /></svg><span>Mods</span></button>
      <button class="rb" data-view="central" title="Central Ludrix — otimizar antes de jogar, dependências e programas úteis"><svg viewBox="0 0 24 24"><path d="M7 10h3v-3l-3.5 -3.5a6 6 0 0 1 8 8l6 6a2 2 0 0 1 -3 3l-6 -6a6 6 0 0 1 -8 -8l3.5 3.5" /></svg><span>Central</span></button>
      <button class="rb" data-view="flash" title="Jogos rápidos"><svg viewBox="0 0 24 24"><path d="M13 3l0 7l6 0l-8 11l0 -7l-6 0l8 -11" /></svg><span>Rápidos</span></button>
    </div>
    <div class="sp"></div>
    <button class="rb" data-view="settings" title="Ajustes"><svg viewBox="0 0 24 24"><path d="M10.325 4.317c.426 -1.756 2.924 -1.756 3.35 0a1.724 1.724 0 0 0 2.573 1.066c1.543 -.94 3.31 .826 2.37 2.37a1.724 1.724 0 0 0 1.065 2.572c1.756 .426 1.756 2.924 0 3.35a1.724 1.724 0 0 0 -1.066 2.573c.94 1.543 -.826 3.31 -2.37 2.37a1.724 1.724 0 0 0 -2.572 1.065c-.426 1.756 -2.924 1.756 -3.35 0a1.724 1.724 0 0 0 -2.573 -1.066c-1.543 .94 -3.31 -.826 -2.37 -2.37a1.724 1.724 0 0 0 -1.065 -2.572c-1.756 -.426 -1.756 -2.924 0 -3.35a1.724 1.724 0 0 0 1.066 -2.573c-.94 -1.543 .826 -3.31 2.37 -2.37c1 .608 2.296 .07 2.572 -1.065" /><path d="M9 12a3 3 0 1 0 6 0a3 3 0 0 0 -6 0" /></svg><span>Ajustes</span></button>
  </nav>

  <main class="glass">
    <header class="top">
      <button class="brandbtn" id="brandBtn" title="Menu do Ludrix"></button>
      <div class="search" id="qbox"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" placeholder="Buscar em tudo…  (/)" autocomplete="off" spellcheck="false"><kbd id="qk">/</kbd></div>
      <div class="chips" id="chips"></div>
      <div class="sp"></div>
      <button class="bell helpbtn" id="helpBtn" title="Precisa de ajuda?" onclick="toggleHelp(event)"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.3-1 .9-1 1.7M12 17h.01"/></svg><span class="hl">Ajuda</span></button>
      <button class="bell" id="bell" title="Notificações" onclick="toggleBell()"><svg viewBox="0 0 24 24"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.9 1.9 0 0 0 3.4 0"/></svg><span class="hl">Notificações</span><i id="bellN"></i></button>
    </header>
    <div class="bellpop helppop" id="helppop"></div>
    <div class="bellpop" id="bellpop"><div class="bh"><b>Notificações</b><span class="sp"></span><button class="btn s xs" onclick="api.post('/api/notifications/ack',{}).then(loadNotifs)">Marcar lidas</button><button class="btn s xs" onclick="api.post('/api/notifications/ack',{clear:true}).then(loadNotifs)">Limpar</button></div><div class="bl" id="bellList"></div></div>
    <section class="view" id="view"></section>
    <footer class="status" id="status"><i class="sdot" id="sdot"></i><span id="stext">Pronto</span><span class="sp"></span><span id="sright"></span></footer>
  </main>
</div>

<div class="detail" id="detail">
  <div class="dbg" id="dBg"></div>
  <div class="dbar" id="dBar"><div class="dbi"><button class="dbb" onclick="closeDetail()" title="Voltar"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button><img id="dBarImg" alt=""><b id="dBarTitle"></b><span class="sp"></span><div class="dba" id="dBarAct"></div></div></div>
  <button class="dclose" id="dClose"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg> Voltar</button>
  <div class="dwrap" id="dWrap"></div>
</div>

<div class="ctx" id="ctx"></div>
<div class="flashwin" id="flashwin"><div class="fbar"><b id="ftitle"></b><span id="fhint"></span><span class="sp"></span><button class="btn s xs" onclick="flashFull()">Tela cheia</button><button class="btn s xs" onclick="closeFlash()">Fechar (Esc)</button></div><iframe id="fframe" allow="autoplay; fullscreen; gamepad"></iframe></div>
<div class="modal" id="modal"><div class="box" id="modalBox"></div></div>
<div class="pal" id="pal" onmousedown="if(event.target===this)palClose()"><div class="palbox"><div class="palq"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input placeholder="Jogo, ação ou ajuste…  (&gt; só ações)" autocomplete="off" spellcheck="false" oninput="palRender(this.value)" onkeydown="palKey(event)"><kbd>Esc</kbd></div><div class="pallist" id="palList"></div></div></div>
<div class="toasts" id="toasts"></div>
<script src="/ui/icons.js"></script>
<script src="/ui/app.js"></script>
<script src="/ui/keys.js"></script>
<script src="/ui/detail.js"></script>
<script src="/ui/settings.js"></script>
<script src="/ui/gamepad.js"></script>
<script src="/ui/sofa.js"></script>
  <button class="qfab" id="qfab" title="Fila de downloads" onclick="setView('downloads')"><svg class="qr" viewBox="0 0 44 44"><circle class="t" cx="22" cy="22" r="19"/><circle class="v" cx="22" cy="22" r="19"/></svg><svg class="qi" viewBox="0 0 24 24"><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2 -2v-2" /><path d="M7 11l5 5l5 -5" /><path d="M12 4l0 12" /></svg><b class="qn"></b></button>
</body>
</html>
